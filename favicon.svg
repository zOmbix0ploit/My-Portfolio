<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14151b"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="hexGrad" x1="14" y1="8" x2="50" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff334b"/>
      <stop offset="100%" stop-color="#b81828"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#262833" stroke-width="1.5"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="rgba(227,43,60,0.4)" stroke-width="1"/>

  <!-- Cybernetic Hexagon Outline with Soft Glow -->
  <path d="M32 9L53 21V43L32 55L11 43V21L32 9Z" 
        stroke="url(#hexGrad)" 
        stroke-width="2.5" 
        fill="rgba(227,43,60,0.12)"
        stroke-linejoin="round"/>

  <!-- Glowing Corner Nodes -->
  <circle cx="32" cy="9" r="1.8" fill="#ff334b"/>
  <circle cx="53" cy="21" r="1.8" fill="#ff334b"/>
  <circle cx="53" cy="43" r="1.8" fill="#ff334b"/>
  <circle cx="32" cy="55" r="1.8" fill="#ff334b"/>
  <circle cx="11" cy="43" r="1.8" fill="#ff334b"/>
  <circle cx="11" cy="21" r="1.8" fill="#ff334b"/>

  <!-- Bold Tech 'N' Monogram -->
  <path d="M22 44V20L42 44V20" 
        stroke="#ffffff" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Tech Accent Indicator -->
  <circle cx="48" cy="15" r="2.2" fill="#e32b3c"/>
</svg>

